name: update-openapi

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-openapi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Checkout Creator Docs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Roblox/creator-docs
          path: .upstream/creator-docs
          fetch-depth: 0
          sparse-checkout: content/en-us/reference/cloud/openapi.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: nightly
          components: clippy, rustfmt

      - name: Update generated API
        run: cargo run -p codegen -- update .upstream/creator-docs

      - name: Open update pull request
        id: pull-request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/update-openapi
          delete-branch: true
          commit-message: "chore: update Open Cloud specification"
          title: "chore: update Open Cloud specification"
          body: |
            Updates the vendored Roblox Creator Docs OpenAPI snapshot and
            regenerates the public Rust API.

            This pull request is generated automatically and requires review.
          add-paths: |
            spec/openapi.json
            spec/source.json
            spec/coverage.json
            src/generated/*.rs

      - name: Check generated output
        if: steps.pull-request.outputs.pull-request-operation == 'created' || steps.pull-request.outputs.pull-request-operation == 'updated'
        run: cargo run -p codegen -- check

      - name: Check formatting
        if: steps.pull-request.outputs.pull-request-operation == 'created' || steps.pull-request.outputs.pull-request-operation == 'updated'
        run: cargo fmt --all -- --check

      - name: Lint
        if: steps.pull-request.outputs.pull-request-operation == 'created' || steps.pull-request.outputs.pull-request-operation == 'updated'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        if: steps.pull-request.outputs.pull-request-operation == 'created' || steps.pull-request.outputs.pull-request-operation == 'updated'
        run: cargo test --workspace --all-features

      - name: Check documentation
        if: steps.pull-request.outputs.pull-request-operation == 'created' || steps.pull-request.outputs.pull-request-operation == 'updated'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: Verify package
        if: steps.pull-request.outputs.pull-request-operation == 'created' || steps.pull-request.outputs.pull-request-operation == 'updated'
        run: cargo package --allow-dirty
