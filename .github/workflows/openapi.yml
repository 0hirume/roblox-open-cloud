name: openapi

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}

defaults:
  run:
    shell: nu {0}

env:
  DOCS_REPOSITORY: Roblox/creator-docs
  RUSTUP_TOOLCHAIN: nightly

jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write # push the generated update branch.
      pull-requests: write # create the review pull request.
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install nushell
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: aqua:nushell/nushell

      - name: install rust nightly
        run: rustup toolchain install nightly --profile minimal --component "clippy,rustfmt"

      - name: update openapi
        id: openapi
        run: nu .github/openapi.nu

      - name: verify
        if: steps.openapi.outputs.changed == 'true'
        run: nu .github/ci.nu --allow-dirty

      - name: open pull request
        if: steps.openapi.outputs.changed == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: nu .github/pull-request.nu
