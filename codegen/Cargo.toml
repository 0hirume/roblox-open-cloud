[package]
name = "codegen"
version = "0.0.0"
edition.workspace = true
description = "Development-only OpenAPI generator for roblox-open-cloud"
license.workspace = true
repository.workspace = true
publish = false
keywords = ["code-generation", "openapi", "roblox"]
categories = ["development-tools::build-utils"]

[dependencies]
heck = "0.5"
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["extra-traits", "full", "parsing"] }
thiserror = "2"

[lints]
workspace = true
