[package]
name = "roblox-open-cloud"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An async Rust client for the recommended Roblox Open Cloud APIs"
documentation = "https://docs.rs/roblox-open-cloud"
readme = "README.md"
license = "MIT"
exclude = ["scripts/**"]
keywords = ["api", "oauth", "open-cloud", "roblox"]
categories = ["api-bindings", "web-programming::http-client"]

[lib]
name = "roblox_open_cloud"
path = "src/lib.rs"

[package.metadata.release]
allow-branch = ["main"]
enable-all-features = true
pre-release-commit-message = "chore: release v{{version}}"
tag-message = "chore: release v{{version}}"
tag-name = "v{{version}}"
verify = true
publish = true
push = true

[dependencies]
bytes = "1"
oauth2 = { version = "5", features = ["reqwest"] }
percent-encoding = "2"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
dead_code = "deny"
unused_results = "deny"
unused_crate_dependencies = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"
disallowed_types = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
shadow_unrelated = "deny"
missing_assert_message = "deny"
partial_pub_fields = "deny"
str_to_string = "deny"
implicit_clone = "deny"
as_conversions = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"
wildcard_enum_match_arm = "deny"
rest_pat_in_fully_bound_structs = "deny"
large_stack_arrays = "deny"
needless_pass_by_value = "deny"
redundant_else = "deny"
large_futures = "deny"
semicolon_if_nothing_returned = "deny"
redundant_closure_for_method_calls = "deny"
map_unwrap_or = "deny"
verbose_file_reads = "deny"
must_use_candidate = "deny"
option_if_let_else = "deny"
empty_line_after_doc_comments = "deny"
single_match_else = "deny"
ref_option_ref = "deny"
trivially_copy_pass_by_ref = "deny"

missing_docs_in_private_items = "allow"
module_name_repetitions = "allow"
redundant_pub_crate = "allow"
# The new standalone repository does not have a canonical public URL yet.
cargo_common_metadata = "allow"
# reqwest and oauth2 currently introduce a small number of benign duplicates.
multiple_crate_versions = "allow"
# Roblox's generated summaries contain product and schema names that are not
# Rust identifiers, so automatic backtick heuristics produce false positives.
doc_markdown = "allow"
# Protocol vocabulary such as access_token and client_id is clearer unchanged.
struct_field_names = "allow"
