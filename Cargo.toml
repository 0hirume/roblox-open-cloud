[workspace]
members = ["codegen"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/0hirume/roblox-open-cloud"

[package]
name = "roblox-open-cloud"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "An async Rust client for the recommended Roblox Open Cloud APIs"
documentation = "https://docs.rs/roblox-open-cloud"
repository.workspace = true
license.workspace = true
exclude = [
    ".github/**",
    "codegen/**",
    "spec/coverage.json",
    "spec/openapi.json",
    "spec/source.json",
]
keywords = ["api", "oauth", "open-cloud", "roblox"]
categories = ["api-bindings", "web-programming::http-client"]

[package.metadata.release]
allow-branch = ["main"]
enable-all-features = true
pre-release-commit-message = "chore: release v{{version}}"
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
tag-message = "chore: release v{{version}}"

[dependencies]
bytes = "1"
oauth2 = "5"
percent-encoding = "2"
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# 0.6.5 uses let-chains, which are unavailable on the 1.85 MSRV.
wiremock = "=0.6.4"

[lints]
workspace = true

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unused_results = "deny"
unused_crate_dependencies = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
shadow_unrelated = "deny"
missing_assert_message = "deny"
partial_pub_fields = "deny"
str_to_string = "deny"
as_conversions = "deny"
lossy_float_literal = "deny"
wildcard_enum_match_arm = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"

module_name_repetitions = "allow"
redundant_pub_crate = "allow"
# reqwest and oauth2 currently introduce a small number of benign duplicates.
multiple_crate_versions = "allow"
# Roblox's generated summaries contain product and schema names that are not
# Rust identifiers, so automatic backtick heuristics produce false positives.
doc_markdown = "allow"
# Protocol vocabulary such as access_token and client_id is clearer unchanged.
struct_field_names = "allow"
